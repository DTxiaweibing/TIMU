<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>下载 shrimpfarm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 340px;
            width: 90%;
        }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin: 0 auto 20px;
            display: block;
        }
        h2 { font-size: 22px; margin-bottom: 8px; color: #1a1a1a; }
        .version { font-size: 13px; color: #999; margin-bottom: 25px; }
        .btn {
            display: block;
            background: #2d89ff;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .btn:active { background: #1a6ed8; }
        .btn.wechat {
            background: #f0f0f0;
            color: #666;
            font-weight: 500;
            font-size: 14px;
        }
        .tip {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="app-icon" src="icon.png" alt="shrimpfarm图标">
        <h2>shrimpfarm</h2>
        <div class="version" id="versionInfo">准备下载...</div>
        <div id="downloadArea">
            <a class="btn" id="downloadBtn" href="#">⬇️ 立即下载</a>
            <div class="btn wechat" id="wechatTip" style="display: none;">
                请点击右上角
🌐 选择"在浏览器打开"
            </div>
        </div>
        <div class="tip" id="statusTip">正在获取最新版本...</div>
    </div>
    <script>
        (function() {
            var downloadBtn = document.getElementById('downloadBtn');
            var wechatTip = document.getElementById('wechatTip');
            var statusTip = document.getElementById('statusTip');
            var versionInfo = document.getElementById('versionInfo');

            // ⬇️ 此占位符由 GitHub Actions 自动替换为 download.txt 中的实际地址
            var DOWNLOAD_URL = 'https://gh-proxy.com/https://github.com/DTxiaweibing/TIMU/releases/latest/download/shrimpfarm.apk';

            if (!DOWNLOAD_URL || DOWNLOAD_URL === '__DOWNLOAD_URL__') {
                statusTip.textContent = '下载地址未配置';
                downloadBtn.style.display = 'none';
                return;
            }

            var ua = navigator.userAgent.toLowerCase();
            var isWechat = ua.indexOf('micromessenger') !== -1;

            if (isWechat) {
                downloadBtn.style.display = 'none';
                wechatTip.style.display = 'block';
                statusTip.textContent = '微信内无法直接下载';
                versionInfo.textContent = '已获取最新版本';
            } else {
                downloadBtn.href = DOWNLOAD_URL;
                statusTip.textContent = '点击按钮即可下载最新版';
                versionInfo.textContent = '已连接到最新版本';
            }
        })();
    </script>
</body>
</html>
