<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>下载 shrimpfarm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 340px;
            width: 90%;
        }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin: 0 auto 20px;
            display: block;
        }
        h2 { font-size: 22px; margin-bottom: 8px; color: #1a1a1a; }
        .version { font-size: 13px; color: #999; margin-bottom: 25px; }
        .btn {
            display: block;
            background: #2d89ff;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .btn:active { background: #1a6ed8; }
        .btn.wechat {
            background: #f0f0f0;
            color: #666;
            font-weight: 500;
            font-size: 14px;
        }
        .tip {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- PNG图标，请将icon.png放在同目录下 -->
        <img class="app-icon" src="icon.png" alt="shrimpfarm图标">
        <h2>shrimpfarm</h2>
        <div class="version" id="versionInfo">准备下载...</div>

        <div id="downloadArea">
            <a class="btn" id="downloadBtn" href="#">⬇️ 立即下载</a>
            <div class="btn wechat" id="wechatTip" style="display: none;">
                请点击右上角<br>🌐 选择“在浏览器打开”
            </div>
        </div>

        <div class="tip" id="statusTip">正在获取最新版本...</div>
    </div>

    <script>
        (async function() {
            const downloadBtn = document.getElementById('downloadBtn');
            const wechatTip = document.getElementById('wechatTip');
            const statusTip = document.getElementById('statusTip');
            const versionInfo = document.getElementById('versionInfo');

            const TXT_URL = 'https://raw.githubusercontent.com/DTxiaweibing/TIMU/main/download/download.txt';

            try {
                const response = await fetch(TXT_URL);
                if (!response.ok) throw new Error('网络错误');
                const url = (await response.text()).trim();

                if (!url) {
                    statusTip.textContent = '下载地址未配置';
                    return;
                }

                const ua = navigator.userAgent.toLowerCase();
                const isWechat = ua.includes('micromessenger');

                if (isWechat) {
                    downloadBtn.style.display = 'none';
                    wechatTip.style.display = 'block';
                    statusTip.textContent = '微信内无法直接下载';
                    versionInfo.textContent = '已获取最新版本';
                } else {
                    downloadBtn.href = url;
                    statusTip.textContent = '点击按钮即可下载最新版';
                    versionInfo.textContent = '已连接到最新版本';
                }
            } catch (err) {
                statusTip.textContent = '获取下载地址失败，请稍后重试';
                downloadBtn.style.display = 'none';
                versionInfo.textContent = '网络异常';
            }
        })();
    </script>
</body>
</html>
