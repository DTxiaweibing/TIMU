<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>对虾养殖决策 · 智能滚动版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #d4e2d0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, 'Roboto', sans-serif;
            padding: 16px;
        }

        .card {
            background: #fefcf5;
            border-radius: 48px;
            padding: 24px 20px 28px 20px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            max-width: 100%;
            width: 100%;
            overflow-x: auto;
        }

        .four-bars {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 12px;
            justify-content: space-evenly;
            margin-bottom: 28px;
        }

        .param-unit {
            flex: 1 1 0;
            min-width: 80px;
            background: #f1f7ef;
            border-radius: 48px;
            padding: 16px 8px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 1px 2px #ffffffc0, 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .current-val {
            font-weight: 800;
            font-size: 1.6rem;
            background: #ffffffd9;
            padding: 8px 12px;
            border-radius: 40px;
            width: 90%;
            text-align: center;
            color: #1c4f2a;
        }

        .vert-slider {
            -webkit-appearance: slider-vertical;
            writing-mode: vertical-lr;
            direction: rtl;
            appearance: slider-vertical;
            width: 40px;
            height: 280px;
            background: #d2e4ca;
            border-radius: 40px;
            margin: 12px 0;
            cursor: pointer;
        }

        .param-label {
            font-size: 0.85rem;
            font-weight: 700;
            background: #e0ebda;
            padding: 6px 12px;
            border-radius: 30px;
            width: 100%;
            text-align: center;
            color: #2c643a;
            white-space: nowrap;
        }

        .unit-sub {
            font-size: 0.7rem;
            font-weight: normal;
        }

        .info-bar {
            background: #1f2a1f;
            border-radius: 48px;
            padding: 16px 20px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 48px;
        }

        .nh3-block {
            background: #2c4030;
            padding: 8px 18px;
            border-radius: 40px;
            color: #e2f0da;
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            font-size: 1rem;
        }

        .status-chip {
            background: #3c5e44;
            padding: 8px 18px;
            border-radius: 40px;
            color: #ffecb3;
            font-size: 0.9rem;
            display: inline-block;
        }

        /* 包裹器：相对定位，用于滚动 */
        .action-wrapper {
            background: #ffae4a;
            border-radius: 40px;
            max-width: 100%;
            overflow-x: hidden;  /* 隐藏滚动条，因为我们要用动画滚动，但保留功能？我们改用动画，所以不用滚动条 */
            position: relative;
            white-space: nowrap;
        }
        /* 滚动内容容器 */
        .action-scroll-container {
            display: inline-block;
            white-space: nowrap;
        }
        .action-content {
            display: inline-block;
            font-weight: 700;
            color: #1f311c;
            font-size: 0.95rem;
            padding: 8px 18px;
        }
        /* 滚动动画 */
        @keyframes scrollText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-scroll {
            animation: scrollText linear infinite;
        }
        /* 鼠标悬停时暂停滚动 */
        .action-wrapper:hover .animate-scroll {
            animation-play-state: paused;
        }

        /* 响应式 */
        @media (max-width: 650px) {
            .four-bars {
                gap: 6px;
            }
            .param-unit {
                min-width: 65px;
                padding: 10px 4px;
            }
            .current-val {
                font-size: 1.2rem;
                padding: 4px 6px;
            }
            .vert-slider {
                height: 200px;
                width: 32px;
            }
            .param-label {
                font-size: 0.65rem;
                white-space: normal;
            }
            .info-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .action-content {
                font-size: 0.8rem;
                padding: 6px 14px;
            }
        }

        @media (max-width: 480px) {
            .vert-slider {
                height: 160px;
                width: 28px;
            }
            .current-val {
                font-size: 1rem;
            }
            .nh3-block {
                font-size: 0.8rem;
                padding: 4px 12px;
            }
        }

        /* 禁用过渡 */
        *, *::before, *::after {
            transition: none !important;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="four-bars">
        <div class="param-unit">
            <div class="current-val" id="tempVal">28.0</div>
            <input type="range" id="tempSlider" class="vert-slider" orient="vertical" min="20" max="33" step="0.5" value="28">
            <div class="param-label">🌡️ 温度 <span class="unit-sub">(℃)</span></div>
        </div>
        <div class="param-unit">
            <div class="current-val" id="phVal">8.20</div>
            <input type="range" id="phSlider" class="vert-slider" orient="vertical" min="7.2" max="9.4" step="0.02" value="8.2">
            <div class="param-label">🧪 pH值</div>
        </div>
        <div class="param-unit">
            <div class="current-val" id="salVal">20</div>
            <input type="range" id="salSlider" class="vert-slider" orient="vertical" min="0" max="40" step="1" value="20">
            <div class="param-label">🧂 盐度 <span class="unit-sub">(‰)</span></div>
        </div>
        <div class="param-unit">
            <div class="current-val" id="tanVal">0.50</div>
            <input type="range" id="tanSlider" class="vert-slider" orient="vertical" min="0" max="4.0" step="0.02" value="0.5">
            <div class="param-label">⚗️ 总氨氮 <span class="unit-sub">(mg/L)</span></div>
        </div>
    </div>

    <div class="info-bar">
        <div class="info-row">
            <div class="nh3-block">
                🧪 NH₃ <strong id="nh3Display">0.000</strong> / <span id="nh3SafeLimit">0.100</span> mg/L
            </div>
        </div>
        <div class="info-row">
            <div id="statusChip" class="status-chip">👀 实时诊断</div>
        </div>
        <div class="info-row">
            <div class="action-wrapper" id="actionWrapper">
                <div class="action-scroll-container" id="scrollContainer">
                    <div class="action-content" id="primaryAction">等待输入</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function getSalinityFactor(sal) {
        if (sal < 5) return 0.45;
        if (sal < 10) return 0.65;
        if (sal < 20) return 0.85;
        if (sal <= 30) return 1.0;
        return 0.85;
    }

    function calcPKa(tempC) {
        let Tk = tempC + 273.15;
        return 0.09018 + (2729.92 / Tk);
    }

    function calcNH3(pH, tempC, tan, salinity) {
        let pKa = calcPKa(tempC);
        let ratio = Math.pow(10, pKa - pH) + 1;
        return tan / ratio;
    }

    function getSafeNH3Threshold(salinity) {
        return 0.1 * getSalinityFactor(salinity);
    }

    function getDecision(pH, tempC, tan, salinity) {
        let safeNH3 = getSafeNH3Threshold(salinity);
        let currentNH3 = calcNH3(pH, tempC, tan, salinity);
        let isNH3Exceed = currentNH3 > safeNH3;
        
        let action = "";
        
        if (pH >= 9.0) {
            action = "🔥 遮光+芽孢光合+乳酸菌100斤";
        } else if (pH >= 8.8) {
            action = "⚠️ 遮光+芽孢光合+乳酸菌50斤";
        } else if (pH >= 8.6) {
            action = "🌞 遮光控藻";
        } else if (pH <= 8.0) {
            action = "🧱 泼洒生石灰5-10kg/亩";
        } else {
            action = "✓ pH正常";
        }
        
        if (isNH3Exceed) {
            if (action === "✓ pH正常") {
                action = "💀 光合菌+红糖，减料增氧";
            } else {
                action = action + " + 光合菌+红糖";
            }
        }
        
        if (pH <= 8.0 && tan > 1.0) {
            action = "🌱 小球藻种+磷酸二氢钾培藻";
        }
        
        if (tempC > 32) {
            action = "🌞 加大增氧/遮阳/加深水位";
        } else if (tempC < 22) {
            action = "❄️ 加温至22℃以上";
        }
        
        if (!action) action = "常规管理";
        
        return { action, currentNH3, safeNH3, isNH3Exceed };
    }
    
    const tempSlider = document.getElementById('tempSlider');
    const phSlider = document.getElementById('phSlider');
    const salSlider = document.getElementById('salSlider');
    const tanSlider = document.getElementById('tanSlider');
    
    const tempValSpan = document.getElementById('tempVal');
    const phValSpan = document.getElementById('phVal');
    const salValSpan = document.getElementById('salVal');
    const tanValSpan = document.getElementById('tanVal');
    
    const nh3DisplaySpan = document.getElementById('nh3Display');
    const nh3SafeLimitSpan = document.getElementById('nh3SafeLimit');
    const primaryActionSpan = document.getElementById('primaryAction');
    const statusChipSpan = document.getElementById('statusChip');
    const actionWrapper = document.getElementById('actionWrapper');
    const scrollContainer = document.getElementById('scrollContainer');
    
    let currentAnimationId = null;
    
    // 更新滚动效果：检测文本是否溢出，如果溢出则启动自动滚动
    function updateScrollEffect() {
        if (!actionWrapper || !scrollContainer) return;
        
        const wrapperWidth = actionWrapper.clientWidth;
        // 获取内容实际宽度（包括padding）
        const contentWidth = scrollContainer.scrollWidth;
        
        // 清除现有动画和克隆节点
        if (scrollContainer.classList.contains('animate-scroll')) {
            scrollContainer.classList.remove('animate-scroll');
        }
        // 移除克隆节点
        const clone = scrollContainer.querySelector('.action-clone');
        if (clone) clone.remove();
        // 重置变换
        scrollContainer.style.transform = '';
        scrollContainer.style.animation = 'none';
        
        if (contentWidth > wrapperWidth) {
            // 需要滚动：克隆一份内容并排
            const originalContent = primaryActionSpan;
            const cloneContent = originalContent.cloneNode(true);
            cloneContent.classList.add('action-clone');
            cloneContent.style.paddingLeft = '0'; // 避免重复边距
            scrollContainer.appendChild(cloneContent);
            
            // 计算滚动速度：每100px 1.5秒，最小5秒，最大15秒
            const totalWidth = contentWidth * 2; // 因为有两份内容，滚动50%相当于一份宽度
            const duration = Math.min(15, Math.max(5, totalWidth / 100));
            scrollContainer.style.animation = `scrollText ${duration}s linear infinite`;
            scrollContainer.classList.add('animate-scroll');
        }
        // else 不滚动，保持原样
    }
    
    function refresh() {
        let temp = parseFloat(tempSlider.value);
        let pH = parseFloat(phSlider.value);
        let sal = parseFloat(salSlider.value);
        let tan = parseFloat(tanSlider.value);
        
        tempValSpan.innerText = temp.toFixed(1);
        phValSpan.innerText = pH.toFixed(2);
        salValSpan.innerText = sal;
        tanValSpan.innerText = tan.toFixed(2);
        
        let safeNH3 = getSafeNH3Threshold(sal);
        let currentNH3 = calcNH3(pH, temp, tan, sal);
        
        nh3DisplaySpan.innerText = currentNH3.toFixed(4);
        nh3SafeLimitSpan.innerText = safeNH3.toFixed(3);
        
        let decision = getDecision(pH, temp, tan, sal);
        primaryActionSpan.innerText = decision.action;
        
        // 状态芯片
        if (pH >= 8.8 || decision.isNH3Exceed || (pH <= 8.0 && tan > 1.2)) {
            statusChipSpan.style.background = "#d9534f";
            statusChipSpan.style.color = "white";
            statusChipSpan.innerText = "🔴 紧急干预";
        } else if (pH >= 8.6 || pH <= 8.0 || tan > 1.2) {
            statusChipSpan.style.background = "#f0ad4e";
            statusChipSpan.style.color = "#2c2b1f";
            statusChipSpan.innerText = "⚠️ 建议处理";
        } else {
            statusChipSpan.style.background = "#5c9e6b";
            statusChipSpan.style.color = "#f9f9ef";
            statusChipSpan.innerText = "✅ 状态良好";
        }
        
        // 动作按钮配色（注意背景色直接设置在scrollContainer上？保留原设计，背景在父级）
        if (pH >= 8.8 || decision.isNH3Exceed) {
            actionWrapper.style.background = "#ff7b2c";
            actionWrapper.style.color = "#271d0c";
        } else if (pH >= 8.6 || pH <= 8.0) {
            actionWrapper.style.background = "#ffbf69";
            actionWrapper.style.color = "#2e3b24";
        } else {
            actionWrapper.style.background = "#c3e0b3";
            actionWrapper.style.color = "#1e4620";
        }
        
        // 更新滚动效果（延迟一小会儿，确保DOM渲染完成）
        setTimeout(updateScrollEffect, 20);
    }
    
    // 窗口大小改变时重新检测滚动
    window.addEventListener('resize', () => setTimeout(updateScrollEffect, 50));
    
    tempSlider.addEventListener('input', refresh);
    phSlider.addEventListener('input', refresh);
    salSlider.addEventListener('input', refresh);
    tanSlider.addEventListener('input', refresh);
    
    refresh();
</script>
</body>
</html>
