private static double getBaseSafeNH3(int day) {
    if (day <= 15) return 0.05;
    if (day <= 45) {
        double t = (day - 15) / 30.0;
        return 0.05 + t * (0.20 - 0.05);
    }
    if (day <= 60) {
        double t = (day - 45) / 15.0;
        return 0.20 + t * (0.35 - 0.20);
    }
    return 0.35;
}
