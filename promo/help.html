<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海水密度盐度计算器 & 动态水质调控板</title>
    <style>
        /* ========== 全局重置 & 整屏滑动 ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
        }

        .page {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        /* ========== 页面1：海水密度盐度计算器（原样保留） ========== */
        .page-1 {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .page-1 .card {
            max-width: 520px; width: 100%; background: white; padding: 30px 28px;
            border-radius: 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .page-1 h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px 0; color: #0b2b3c; }
        .page-1 .sub { font-size: 14px; color: #5e7a8a; margin-bottom: 28px; border-left: 4px solid #2b7a8a; padding-left: 12px; background: #f7fafc; border-radius: 0 8px 8px 0; }
        .page-1 .group { margin-bottom: 22px; }
        .page-1 label { display: block; font-size: 14px; font-weight: 600; color: #1e4a5f; margin-bottom: 5px; }
        .page-1 .input-wrap { display: flex; align-items: center; background: #f9fcff; border: 1.5px solid #dde7ef; border-radius: 14px; transition: 0.2s; padding: 0 16px; }
        .page-1 .input-wrap:focus-within { border-color: #2b7a8a; box-shadow: 0 0 0 3px rgba(43,122,138,0.15); }
        .page-1 input { width: 100%; padding: 14px 0; border: none; background: transparent; font-size: 18px; font-weight: 500; color: #0b2b3c; outline: none; }
        .page-1 input::placeholder { color: #b0c8d6; font-weight: 400; font-size: 16px; }
        .page-1 .unit { font-size: 15px; color: #4b6f82; font-weight: 500; margin-left: 8px; }
        .page-1 .result-box {
            background: #e6f3f7; border-radius: 16px; padding: 18px 20px; margin-top: 18px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #b8d8e5;
        }
        .page-1 .result-box .label { font-size: 14px; color: #1c5a6b; font-weight: 600; }
        .page-1 .result-box .value { font-size: 26px; font-weight: 700; color: #033b4a; letter-spacing: 0.5px; }
        .page-1 .result-box .value .small { font-size: 16px; font-weight: 400; color: #2f6b7e; margin-left: 4px; }
        .page-1 .hint { font-size: 13px; color: #6f8fa0; margin-top: 16px; text-align: center; background: #f7fafc; padding: 8px; border-radius: 30px; }
        .page-1 .hint span { font-weight: 600; color: #1a5a6a; }
        .page-1 .warn { color: #c0392b; background: #fde8e8; padding: 6px 12px; border-radius: 30px; font-size: 13px; margin-top: 10px; display: none; }

        /* ========== 页面2：动态水质调控板（原样保留） ========== */
        .page-2 {
            background: #d4e2d0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, 'Roboto', sans-serif;
            padding: 8px;
            user-select: none;
        }
        .page-2 .card {
            background: #fefcf5;
            border-radius: 40px;
            padding: 20px 12px 20px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            max-width: 100%;
            width: 100%;
            overflow: hidden;
        }
        .page-2 .title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #1c4f2a;
            margin-bottom: 20px;
        }
        .page-2 .five-bars {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 6px;
            justify-content: space-evenly;
            margin-bottom: 24px;
        }
        .page-2 .param-unit {
            flex: 1 1 0;
            min-width: 55px;
            background: #f1f7ef;
            border-radius: 32px;
            padding: 10px 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .page-2 .current-val {
            font-weight: 800;
            font-size: 1.1rem;
            background: #ffffffd9;
            padding: 3px 4px;
            border-radius: 28px;
            width: 90%;
            text-align: center;
            color: #1c4f2a;
        }
        .page-2 .vert-slider {
            -webkit-appearance: slider-vertical;
            writing-mode: vertical-lr;
            direction: rtl;
            appearance: slider-vertical;
            width: 24px;
            height: 320px;
            background: #d2e4ca;
            border-radius: 28px;
            margin: 8px 0;
            cursor: pointer;
        }
        .page-2 .param-label {
            font-size: 1.05rem;
            font-weight: 700;
            background: #e0ebda;
            padding: 3px 6px;
            border-radius: 20px;
            width: 100%;
            text-align: center;
            color: #2c643a;
            white-space: nowrap;
        }
        .page-2 .info-header {
            background: #2c4030;
            border-radius: 44px;
            padding: 18px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2f0da;
        }
        .page-2 .info-header span {
            font-size: 1.1rem;
        }
        .page-2 .advice-container {
            background: #e8f5e9;
            border-radius: 40px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .page-2 .advice-row {
            background: transparent;
            border-radius: 36px;
            min-height: 44px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: thin;
            display: flex;
            align-items: center;
        }
        .page-2 .advice-row::-webkit-scrollbar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 4px;
        }
        .page-2 .advice-row::-webkit-scrollbar-thumb {
            background: #b0b0b0;
            border-radius: 4px;
        }
        .page-2 .advice-content {
            display: inline-block;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 36px;
            width: 100%;
        }
        .page-2 .placeholder {
            color: #7e9a78;
            font-weight: normal;
            background: transparent;
        }
        .page-2 .temp-advice { background: #ffae4a; color: #1f311c; }
        .page-2 .ph-advice { background: #ffae4a; color: #1f311c; }
        .page-2 .nh3-advice { background: #ff8c5a; color: #1f311c; }

        /* 页面2的响应式 */
        @media (max-width: 550px) {
            .page-2 .five-bars { gap: 4px; }
            .page-2 .param-unit { min-width: 48px; padding: 8px 2px; }
            .page-2 .current-val { font-size: 0.9rem; }
            .page-2 .vert-slider { height: 220px; width: 20px; }
            .page-2 .param-label { font-size: 0.85rem; white-space: normal; }
            .page-2 .advice-content { font-size: 0.75rem; padding: 6px 10px; }
            .page-2 .title { font-size: 1.3rem; }
            .page-2 .info-header { font-size: 0.9rem; padding: 12px 14px; }
            .page-2 .info-header span { font-size: 0.9rem; }
        }
        @media (max-width: 450px) {
            .page-2 .vert-slider { height: 180px; width: 18px; }
            .page-2 .current-val { font-size: 0.8rem; }
            .page-2 .param-label { font-size: 0.75rem; }
            .page-2 .title { font-size: 1.2rem; }
            .page-2 .info-header { font-size: 0.8rem; padding: 10px 12px; }
            .page-2 .info-header span { font-size: 0.8rem; }
        }
        .page-2 * { transition: none !important; }

        /* ========== 页面指示器 ========== */
        .page-indicator {
            position: fixed;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .page-indicator button {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.7);
            background: transparent;
            cursor: pointer;
            padding: 0;
            transition: background 0.3s;
        }
        .page-indicator button.active {
            background: white;
        }
    </style>
</head>
<body>

<div class="container">

<!-- ========== 页面1：海水密度盐度计算器 ========== -->
<div class="page page-1">
<div class="card">
    <h1>🌊 海水状态转换</h1>
    <div class="sub">基于 EOS-80 标准 · 盐度上限 40 PSU</div>

    <div class="group">
        <label>🌡️ 温度 <span style="font-weight:400;color:#5e7a8a;">(必填)</span></label>
        <div class="input-wrap">
            <input type="number" id="temp" step="any" placeholder="例如 25" value="25">
            <span class="unit">℃</span>
        </div>
    </div>

    <div class="group">
        <label>🧂 实用盐度 <span style="font-weight:400;color:#5e7a8a;">(0~40)</span></label>
        <div class="input-wrap">
            <input type="number" id="sal" step="any" placeholder="例如 30" min="0" max="40">
            <span class="unit">PSU</span>
        </div>
    </div>

    <div class="group">
        <label>⚖️ 海平面密度</label>
        <div class="input-wrap">
            <input type="number" id="dens" step="any" placeholder="例如 1021.5">
            <span class="unit">kg/m³</span>
        </div>
    </div>

    <div class="result-box">
        <span class="label">📌 计算结果</span>
        <span class="value" id="resultDisplay">— <span class="small">等待输入</span></span>
    </div>
    <div id="warningMsg" class="warn"></div>
    <div class="hint">💡 修改任意框自动计算缺失值 · 温度默认25℃</div>
</div>
</div>

<!-- ========== 页面2：动态水质调控板 ========== -->
<div class="page page-2">
<div class="card">
    <div class="title">动态水质调控板</div>

    <div class="five-bars">
        <div class="param-unit"><div class="current-val" id="tempVal">28.0</div><input type="range" id="tempSlider" class="vert-slider" min="20" max="33" step="0.5" value="28"><div class="param-label">温度(℃)</div></div>
        <div class="param-unit"><div class="current-val" id="phVal">8.20</div><input type="range" id="phSlider" class="vert-slider" min="7.2" max="9.4" step="0.02" value="8.2"><div class="param-label">pH值</div></div>
        <div class="param-unit"><div class="current-val" id="salVal">20</div><input type="range" id="salSlider" class="vert-slider" min="0" max="40" step="1" value="20"><div class="param-label">盐度(‰)</div></div>
        <div class="param-unit"><div class="current-val" id="tanVal">0.50</div><input type="range" id="tanSlider" class="vert-slider" min="0" max="4.0" step="0.02" value="0.5"><div class="param-label">总氨氮</div></div>
        <div class="param-unit"><div class="current-val" id="dayVal">30</div><input type="range" id="daySlider" class="vert-slider" min="1" max="100" step="1" value="30"><div class="param-label">养殖天数</div></div>
    </div>

    <div class="info-header">
        <span>🧪 NH₃ <strong id="nh3Display">0.000</strong> mg/L</span>
        <span>安全阈值: <strong id="nh3SafeLimit">0.100</strong> mg/L</span>
        <span id="dayHint" style="font-size:0.85rem;">(天数30)</span>
    </div>

    <div class="advice-container">
        <div class="advice-row" id="tempAdviceRow"><div class="advice-content temp-advice" id="tempAdviceText">— — —</div></div>
        <div class="advice-row" id="phAdviceRow"><div class="advice-content ph-advice" id="phAdviceText">— — —</div></div>
        <div class="advice-row" id="nh3AdviceRow"><div class="advice-content nh3-advice" id="nh3AdviceText">— — —</div></div>
    </div>
</div>
</div>

</div>

<!-- 页面指示器 -->
<div class="page-indicator">
    <button class="active" data-page="0"></button>
    <button data-page="1"></button>
</div>

<script>
// ========== 页面指示器 ==========
(function() {
    var container = document.querySelector('.container');
    var dots = document.querySelectorAll('.page-indicator button');

    container.addEventListener('scroll', function() {
        var scrollTop = container.scrollTop;
        var viewHeight = container.clientHeight;
        var activeIndex = Math.round(scrollTop / viewHeight);
        dots.forEach(function(dot, i) {
            dot.classList.toggle('active', i === activeIndex);
        });
    });

    dots.forEach(function(dot) {
        dot.addEventListener('click', function() {
            var index = parseInt(this.getAttribute('data-page'));
            container.scrollTo({ top: index * container.clientHeight, behavior: 'smooth' });
        });
    });
})();

// ========== 页面1：海水密度盐度计算器脚本 ==========
(function() {
    function pureWaterDensity(T) {
        return 999.842594 
            + 6.793952e-2 * T 
            - 9.095290e-3 * T * T 
            + 1.001685e-4 * T * T * T 
            - 1.120083e-6 * T * T * T * T 
            + 6.536336e-9 * T * T * T * T * T;
    }

    function seawaterDensity(T, S) {
        if (S < 0) S = 0;
        if (S > 40) S = 40;
        const rho_w = pureWaterDensity(T);
        const A = 0.824493 
            - 4.0899e-3 * T 
            + 7.6438e-5 * T * T 
            - 8.2467e-7 * T * T * T 
            + 5.3875e-9 * T * T * T * T;
        const B = -5.72466e-3 
            + 1.0227e-4 * T 
            - 1.6546e-6 * T * T;
        const C = 4.8314e-4;
        return rho_w + A * S + B * Math.pow(S, 1.5) + C * S * S;
    }

    function solveSalinity(T, targetDensity) {
        let S_low = 0.0;
        let S_high = 40.0;
        let S_mid = 0;
        const rho_low = seawaterDensity(T, S_low);
        const rho_high = seawaterDensity(T, S_high);
        if (targetDensity <= rho_low) return 0;
        if (targetDensity >= rho_high) return 40;
        for (let i = 0; i < 100; i++) {
            S_mid = (S_low + S_high) / 2;
            const rho_mid = seawaterDensity(T, S_mid);
            if (rho_mid < targetDensity) S_low = S_mid;
            else S_high = S_mid;
            if (S_high - S_low < 1e-8) break;
        }
        return (S_low + S_high) / 2;
    }

    const tempInput = document.getElementById('temp');
    const salInput = document.getElementById('sal');
    const densInput = document.getElementById('dens');
    const resultDisplay = document.getElementById('resultDisplay');
    const warningMsg = document.getElementById('warningMsg');

    function fmt(v) { return Number(v).toFixed(3); }
    let isUpdating = false;

    function showWarning(text) {
        warningMsg.textContent = text;
        warningMsg.style.display = 'block';
        clearTimeout(window.warnTimer);
        window.warnTimer = setTimeout(function() { warningMsg.style.display = 'none'; }, 4000);
    }

    function updateAll(trigger) {
        if (isUpdating) return;
        const T = parseFloat(tempInput.value);
        if (isNaN(T)) {
            salInput.value = '';
            densInput.value = '';
            resultDisplay.innerHTML = '⚠️ 请先输入有效温度';
            return;
        }

        const S_val = salInput.value.trim();
        const D_val = densInput.value.trim();
        const hasS = S_val !== '' && !isNaN(parseFloat(S_val));
        const hasD = D_val !== '' && !isNaN(parseFloat(D_val));

        if (!hasS && !hasD) {
            resultDisplay.innerHTML = '📝 请输入 <strong>盐度</strong> 或 <strong>密度</strong>';
            return;
        }

        if (trigger === 'sal' && hasS) {
            let S = parseFloat(S_val);
            if (S < 0) { S = 0; salInput.value = '0'; showWarning('盐度不能为负，已修正为0'); }
            if (S > 40) { S = 40; salInput.value = '40'; showWarning('盐度上限40，已截断'); }
            const computedD = seawaterDensity(T, S);
            isUpdating = true;
            densInput.value = fmt(computedD);
            isUpdating = false;
            resultDisplay.innerHTML = 'ρ = <strong>' + fmt(computedD) + '</strong> <span class="small">kg/m³</span>';
            return;
        }

        if (trigger === 'dens' && hasD) {
            let D = parseFloat(D_val);
            const rho0 = seawaterDensity(T, 0);
            const rho40 = seawaterDensity(T, 40);
            if (D < rho0 - 1 || D > rho40 + 1) {
                showWarning('密度值超出当前温度下可行范围 (' + fmt(rho0) + ' ~ ' + fmt(rho40) + ')');
            }
            let computedS = solveSalinity(T, D);
            if (computedS < 0.001) computedS = 0;
            if (computedS > 39.999) computedS = 40;
            isUpdating = true;
            salInput.value = fmt(computedS);
            isUpdating = false;
            resultDisplay.innerHTML = 'S ≈ <strong>' + fmt(computedS) + '</strong> <span class="small">PSU</span>';
            return;
        }

        if (trigger === 'temp' || trigger === null) {
            if (hasS) {
                let S = parseFloat(S_val);
                if (S < 0) { S = 0; salInput.value = '0'; showWarning('盐度不能为负，已修正'); }
                if (S > 40) { S = 40; salInput.value = '40'; showWarning('盐度上限40，已截断'); }
                const computedD = seawaterDensity(T, S);
                isUpdating = true;
                densInput.value = fmt(computedD);
                isUpdating = false;
                resultDisplay.innerHTML = 'ρ = <strong>' + fmt(computedD) + '</strong> <span class="small">kg/m³</span>';
            } else if (hasD) {
                let D = parseFloat(D_val);
                let computedS = solveSalinity(T, D);
                if (computedS < 0.001) computedS = 0;
                if (computedS > 39.999) computedS = 40;
                isUpdating = true;
                salInput.value = fmt(computedS);
                isUpdating = false;
                resultDisplay.innerHTML = 'S ≈ <strong>' + fmt(computedS) + '</strong> <span class="small">PSU</span>';
            } else {
                resultDisplay.innerHTML = '📝 请输入 <strong>盐度</strong> 或 <strong>密度</strong>';
            }
            return;
        }

        resultDisplay.innerHTML = '— <span class="small">未知状态</span>';
    }

    tempInput.addEventListener('input', function(e) {
        if (isUpdating) return;
        if (this.value === '') {
            salInput.value = '';
            densInput.value = '';
            resultDisplay.innerHTML = '⚠️ 请先输入温度';
            return;
        }
        updateAll('temp');
    });

    salInput.addEventListener('input', function(e) {
        if (isUpdating) return;
        var val = this.value.trim();
        if (val === '') {
            densInput.value = '';
            if (tempInput.value !== '') {
                resultDisplay.innerHTML = '📝 请输入 <strong>密度</strong> 或重新输入盐度';
            } else {
                resultDisplay.innerHTML = '⚠️ 请先输入温度';
            }
            return;
        }
        if (isNaN(parseFloat(tempInput.value))) {
            showWarning('请先输入有效温度');
            this.value = '';
            return;
        }
        updateAll('sal');
    });

    densInput.addEventListener('input', function(e) {
        if (isUpdating) return;
        var val = this.value.trim();
        if (val === '') {
            salInput.value = '';
            if (tempInput.value !== '') {
                resultDisplay.innerHTML = '📝 请输入 <strong>盐度</strong> 或重新输入密度';
            } else {
                resultDisplay.innerHTML = '⚠️ 请先输入温度';
            }
            return;
        }
        if (isNaN(parseFloat(tempInput.value))) {
            showWarning('请先输入有效温度');
            this.value = '';
            return;
        }
        updateAll('dens');
    });

    window.addEventListener('load', function() {
        tempInput.value = '25';
        salInput.value = '';
        densInput.value = '';
        resultDisplay.innerHTML = '📝 请输入 <strong>盐度</strong> 或 <strong>密度</strong>';
    });
})();

// ========== 页面2：动态水质调控板脚本 ==========
function getSalinityFactor(sal) {
    if (sal < 5) return 0.45;
    if (sal < 10) return 0.65;
    if (sal < 20) return 0.85;
    return 1.0;
}

function getBaseSafeNH3(day) {
    if (day <= 15) return 0.05;
    if (day <= 45) {
        var t = (day - 15) / 30.0;
        return +(0.05 + t * (0.20 - 0.05)).toFixed(3);
    }
    if (day <= 60) {
        var t = (day - 45) / 15.0;
        return +(0.20 + t * (0.35 - 0.20)).toFixed(3);
    }
    return 0.35;
}

function getFinalSafeNH3(salinity, day) {
    var base = getBaseSafeNH3(day);
    var factor = getSalinityFactor(salinity);
    return base * factor;
}

function calcPKa(tempC) {
    return 0.09018 + 2729.92 / (tempC + 273.15);
}

function calcNH3(pH, tempC, tan, salinity) {
    var pKa = calcPKa(tempC);
    var ratio = Math.pow(10, pKa - pH) + 1;
    return tan / ratio;
}

function getTempAdvice(tempC) {
    if (tempC > 32) return '\u{1F321}\uFE0F 温度 ' + tempC.toFixed(1) + '\u2103：加大增氧、遮阳、加深水位';
    if (tempC < 22) return '\u2744\uFE0F 温度 ' + tempC.toFixed(1) + '\u2103：请加温至22\u2103以上';
    return '';
}

function getPhAdvice(pH) {
    if (pH >= 9.0) return '\u{1F9EA} pH ' + pH.toFixed(2) + '：遮光+芽孢光合+乳酸菌100斤/亩';
    if (pH >= 8.8) return '\u{1F9EA} pH ' + pH.toFixed(2) + '：遮光+芽孢光合+乳酸菌50斤/亩';
    if (pH >= 8.7) return '\u{1F9EA} pH ' + pH.toFixed(2) + '：遮光控藻';
    if (pH <= 8.0) return '\u{1F9EA} pH ' + pH.toFixed(2) + '：泼洒生石灰5-10kg/亩';
    return '';
}

function getNh3Advice(nh3, safeNh3, tan, pH) {
    if (nh3 > safeNh3) {
        var advice = '\u26A0\uFE0F NH\u2083超：光合菌+红糖，减料增氧';
        if (pH <= 8.0 && tan > 1.0) advice += '，小球藻种+磷酸二氢钾培藻';
        return advice;
    }
    return '';
}

var tempSlider = document.getElementById('tempSlider');
var phSlider = document.getElementById('phSlider');
var salSlider = document.getElementById('salSlider');
var tanSlider = document.getElementById('tanSlider');
var daySlider = document.getElementById('daySlider');
var tempVal = document.getElementById('tempVal');
var phVal = document.getElementById('phVal');
var salVal = document.getElementById('salVal');
var tanVal = document.getElementById('tanVal');
var dayVal = document.getElementById('dayVal');
var nh3Display = document.getElementById('nh3Display');
var nh3SafeLimitSpan = document.getElementById('nh3SafeLimit');
var dayHint = document.getElementById('dayHint');
var tempAdviceText = document.getElementById('tempAdviceText');
var phAdviceText = document.getElementById('phAdviceText');
var nh3AdviceText = document.getElementById('nh3AdviceText');

function refresh() {
    var temp = parseFloat(tempSlider.value);
    var pH = parseFloat(phSlider.value);
    var sal = parseFloat(salSlider.value);
    var tan = parseFloat(tanSlider.value);
    var day = parseInt(daySlider.value);

    tempVal.innerText = temp.toFixed(1);
    phVal.innerText = pH.toFixed(2);
    salVal.innerText = sal;
    tanVal.innerText = tan.toFixed(2);
    dayVal.innerText = day;

    var safeNH3 = getFinalSafeNH3(sal, day);
    var currentNH3 = calcNH3(pH, temp, tan, sal);
    nh3Display.innerText = currentNH3.toFixed(4);
    nh3SafeLimitSpan.innerText = safeNH3.toFixed(3);
    dayHint.innerText = '(天数' + day + ')';

    var tempAdv = getTempAdvice(temp);
    var phAdv = getPhAdvice(pH);
    var nh3Adv = getNh3Advice(currentNH3, safeNH3, tan, pH);

    tempAdviceText.innerText = tempAdv || '\u2014 \u2014 \u2014';
    phAdviceText.innerText = phAdv || '\u2014 \u2014 \u2014';
    nh3AdviceText.innerText = nh3Adv || '\u2014 \u2014 \u2014';

    tempAdviceText.className = tempAdv ? 'advice-content temp-advice' : 'advice-content placeholder';
    phAdviceText.className = phAdv ? 'advice-content ph-advice' : 'advice-content placeholder';
    nh3AdviceText.className = nh3Adv ? 'advice-content nh3-advice' : 'advice-content placeholder';
}

[tempSlider, phSlider, salSlider, tanSlider, daySlider].forEach(function(s) { s.addEventListener('input', refresh); });
refresh();
</script>
</body>
</html>
