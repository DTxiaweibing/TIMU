<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海水密度盐度计算器 & 动态水质调控板</title>
    <style>
        /* ========== 全局重置 & 整屏滑动 ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: none;
        }

        .page {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        /* ========== 页面1：海水密度盐度计算器（原样保留） ========== */
        .page-1 {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .page-1 .card {
            max-width: 520px; width: 100%; background: white; padding: 30px 28px;
            border-radius: 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .page-1 h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px 0; color: #0b2b3c; }
        .page-1 .sub { font-size: 14px; color: #5e7a8a; margin-bottom: 28px; border-left: 4px solid #2b7a8a; padding-left: 12px; background: #f7fafc; border-radius: 0 8px 8px 0; }
        .page-1 .group { margin-bottom: 22px; }
        .page-1 label { display: block; font-size: 14px; font-weight: 600; color: #1e4a5f; margin-bottom: 5px; }
        .page-1 .input-wrap { display: flex; align-items: center; background: #f9fcff; border: 1.5px solid #dde7ef; border-radius: 14px; transition: 0.2s; padding: 0 16px; }
        .page-1 .input-wrap:focus-within { border-color: #2b7a8a; box-shadow: 0 0 0 3px rgba(43,122,138,0.15); }
        .page-1 input { width: 100%; padding: 14px 0; border: none; background: transparent; font-size: 18px; font-weight: 500; color: #0b2b3c; outline: none; }
        .page-1 input::placeholder { color: #b0c8d6; font-weight: 400; font-size: 16px; }
        .page-1 .unit { font-size: 15px; color: #4b6f82; font-weight: 500; margin-left: 8px; }
        .page-1 .result-box {
            background: #e6f3f7; border-radius: 16px; padding: 18px 20px; margin-top: 18px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #b8d8e5;
        }
        .page-1 .result-box .label { font-size: 14px; color: #1c5a6b; font-weight: 600; }
        .page-1 .result-box .value { font-size: 26px; font-weight: 700; color: #033b4a; letter-spacing: 0.5px; }
        .page-1 .result-box .value .small { font-size: 16px; font-weight: 400; color: #2f6b7e; margin-left: 4px; }
        .page-1 .hint { font-size: 13px; color: #6f8fa0; margin-top: 16px; text-align: center; background: #f7fafc; padding: 8px; border-radius: 30px; }
        .page-1 .hint span { font-weight: 600; color: #1a5a6a; }
        .page-1 .warn { color: #c0392b; background: #fde8e8; padding: 6px 12px; border-radius: 30px; font-size: 13px; margin-top: 10px; display: none; }

        /* ========== 页面2：动态水质调控板（原样保留） ========== */
        .page-2 {
            background: #d4e2d0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, 'Roboto', sans-serif;
            padding: 8px;
            user-select: none;
        }
        .page-2 .card {
            background: #fefcf5;
            border-radius: 40px;
            padding: 20px 12px 20px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            max-width: 100%;
            width: 100%;
            overflow: hidden;
        }
        .page-2 .title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #1c4f2a;
            margin-bottom: 20px;
        }
        .page-2 .five-bars {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 6px;
            justify-content: space-evenly;
            margin-bottom: 24px;
        }
        .page-2 .param-unit {
            flex: 1 1 0;
            min-width: 55px;
            background: #f1f7ef;
            border-radius: 32px;
            padding: 10px 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

            font-weight: 800;
            font-size: 1.1rem;
            background: #ffffffd9;

            bor
