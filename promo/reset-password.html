<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置密码 - 养虾助手</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: #005fcc; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover:not(:disabled) { background: #0045a3; }
        button:disabled { background: #a0c4e8; cursor: not-allowed; }
        .msg { margin-top: 15px; font-weight: bold; min-height: 20px; }
        .success { color: green; }
        .error { color: red; }
        .loading { opacity: 0.8; }
        .debug-info { background: #f4f4f4; padding: 10px; text-align: left; font-size: 12px; overflow-x: auto; margin-top: 15px; border-radius: 4px; }
        .debug-info summary { cursor: pointer; font-weight: bold; color: #666; }
        .step-info { font-size: 14px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 重置密码</h2>
        <div id="status">正在初始化...</div>
        <div id="step-info" class="step-info"></div>
        <div id="form" style="display:none;">
            <input type="password" id="password" placeholder="请输入新密码（至少6位）">
            <button onclick="resetPassword()" id="resetBtn">确认修改</button>
            <div id="msg" class="msg"></div>
        </div>
        <details class="debug-info" id="debugPanel" style="display:none;">
            <summary>调试信息（点击展开）</summary>
            <pre id="debugContent"></pre>
        </details>
    </div>

    <script>
        const sbUrl = 'https://apumkkayconibhkaawdn.supabase.co';
        const sbKey = 'sb_publishable_Tn8FsSUL4iDqUsNQGzos6Q_6zMKytC5';
        let sbClient = null;

        // 收集调试信息
        const debugLogs = [];
        function logDebug(step, data) {
            try {
                const entry = `[${new Date().toLocaleTimeString()}] ${step}:\n${JSON.stringify(data, null, 2)}`;
                debugLogs.push(entry);
                const debugContent = document.getElementById('debugContent');
                const debugPanel = document.getElementById('debugPanel');
                if (debugContent) debugContent.textContent = debugLogs.join('\n\n');
                if (debugPanel) debugPanel.style.display = 'block';
            } catch (e) {}
            console.log(step, data);
        }

        // 显示状态信息
        function setStatus(text, isError = false) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.innerHTML = text;
                statusDiv.style.color = isError ? 'red' : '#333';
            }
        }

        // 显示当前步骤
        function setStepInfo(text) {
            const el = document.getElementById('step-info');
            if (el) el.textContent = text;
        }

        // 解析URL中的query参数（PKCE流程：token_hash在?后面）
        function parseQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                token_hash: params.get('token_hash'),
                type: params.get('type'),
                next: params.get('next')
            };
        }

        // 解析URL中的hash参数（旧Implicit流程：access_token在#后面）
        function parseHashParams() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return {
                access_token: params.get('access_token'),
                refresh_token: params.get('refresh_token'),
                type: params.get('type'),
                expires_in: params.get('expires_in')
            };
        }

        // 初始化：自动检测流程类型并处理
        async function init() {
            try {
                // 先检查Supabase库是否加载成功
                if (typeof createClient !== 'function') {
                    setStatus('❌ Supabase库未加载完成，请刷新页面重试', true);
                    logDebug('库加载检查', { createClientExists: typeof createClient, windowSupabase: typeof window.supabase });
                    return;
                }

                // 创建Supabase客户端（注意：CDN脚本会创建window.supabase，所以用不同变量名）
                sbClient = createClient(sbUrl, sbKey);
                logDebug('Supabase客户端创建', { success: !!sbClient, windowSupabaseExists: !!window.supabase });

                // 步骤1：记录完整的URL信息
                setStatus('🔍 步骤1/5：正在分析链接...');
                setStepInfo('检查URL结构，判断是PKCE流程还是Implicit流程');
                
                const fullUrl = window.location.href;
                const queryString = window.location.search;
                const hashString = window.location.hash;
                
                logDebug('URL信息', {
                    fullUrl: fullUrl,
                    queryString: queryString,
                    hashString: hashString,
                    pathname: window.location.pathname
                });

                // 步骤2：尝试解析PKCE参数（?token_hash=xxx）
                setStatus('🔍 步骤2/5：正在解析PKCE参数...');
                setStepInfo('从URL的query string中查找token_hash');
                
                const queryParams = parseQueryParams();
                logDebug('Query参数解析结果', queryParams);

                // 如果有token_hash，使用PKCE流程
                if (queryParams.token_hash) {
                    setStatus('✅ 检测到PKCE流程，正在验证...');
                    setStepInfo('使用token_hash调用verifyOtp进行验证');
                    await handlePkceFlow(queryParams);
                    return;
                }

                // 步骤3：如果没有token_hash，尝试解析Implicit参数（#access_token=xxx）
                setStatus('🔍 步骤3/5：未找到PKCE参数，尝试Implicit流程...');
                setStepInfo('从URL的hash fragment中查找access_token');
                
                const hashParams = parseHashParams();
                logDebug('Hash参数解析结果', hashParams);

                if (hashParams.access_token) {
                    setStatus('✅ 检测到Implicit流程，正在验证...');
                    setStepInfo('使用access_token调用setSession建立会话');
                    await handleImplicitFlow(hashParams);
                    return;
                }

                // 步骤4：两种参数都没找到
                setStatus('❌ 链接无效：找不到验证令牌', true);
                setStepInfo('');
                logDebug('错误', {
                    error: '未找到token_hash或access_token',
                    suggestion: '请确保从邮件中点击完整链接打开，不要手动复制粘贴部分链接'
                });
                
            } catch (err) {
                setStatus(`❌ 初始化失败：${err.message}`, true);
                setStepInfo('');
                logDebug('初始化异常', { error: err.message, stack: err.stack });
                console.error(err);
            }
        }

        // 处理PKCE流程
        async function handlePkceFlow(params) {
            try {
                // 检查type参数
                if (!params.type) {
                    setStatus('❌ 链接缺少type参数', true);
                    logDebug('PKCE错误', { error: 'type参数为空', params: params });
                    return;
                }

                if (params.type !== 'recovery') {
                    setStatus(`❌ 链接类型错误：期望 "recovery"，实际收到 "${params.type}"`, true);
                    logDebug('PKCE错误', { 
                        error: 'type参数不匹配',
                        expected: 'recovery',
                        actual: params.type
                    });
                    return;
                }

                // 调用verifyOtp验证
                setStatus('🔐 步骤4/5：正在调用verifyOtp验证令牌...');
                setStepInfo('向Supabase服务器发送验证请求');
                
                logDebug('verifyOtp请求参数', {
                    token_hash: params.token_hash.substring(0, 10) + '...',
                    type: params.type
                });

                const { data, error } = await sbClient.auth.verifyOtp({
                    token_hash: params.token_hash,
                    type: 'recovery'
                });

                logDebug('verifyOtp响应', { data: data, error: error });

                if (error) {
                    setStatus(`❌ verifyOtp验证失败：${error.message}`, true);
                    setStepInfo('');
                    logDebug('verifyOtp错误详情', { 
                        message: error.message,
                        status: error.status,
                        code: error.code
                    });
                    return;
                }

                if (!data || !data.session) {
                    setStatus('❌ verifyOtp返回了空会话，验证可能未成功', true);
                    setStepInfo('');
                    logDebug('verifyOtp异常', { 
                        error: '返回数据中没有session',
                        data: data 
                    });
                    return;
                }

                // 验证成功
                setStatus('✅ 验证成功！请设置新密码');
                setStepInfo('会话已建立，可以输入新密码');
                logDebug('验证成功', { 
                    user: data.user ? { id: data.user.id, email: data.user.email } : null,
                    sessionExists: !!data.session
                });
                
                document.getElementById('status').style.display = 'none';
                document.getElementById('step-info').style.display = 'none';
                document.getElementById('form').style.display = 'block';

            } catch (err) {
                setStatus(`❌ PKCE流程失败：${err.message}`, true);
                setStepInfo('');
                logDebug('PKCE流程异常', { error: err.message, stack: err.stack });
                console.error(err);
            }
        }

        // 处理Implicit流程：让Supabase自动处理hash中的token，然后获取session
        async function handleImplicitFlow(params) {
            try {
                if (!params.type) {
                    setStatus('❌ 链接缺少type参数', true);
                    logDebug('Implicit错误', { error: 'type参数为空' });
                    return;
                }

                if (params.type !== 'recovery') {
                    setStatus(`❌ 链接类型错误：期望 "recovery"，实际收到 "${params.type}"`, true);
                    logDebug('Implicit错误', { expected: 'recovery', actual: params.type });
                    return;
                }

                setStatus('🔐 步骤4/5：正在获取会话...');
                setStepInfo('Supabase会自动处理hash中的token，等待获取session');
                
                logDebug('Implicit参数', {
                    access_token: params.access_token ? params.access_token.substring(0, 20) + '...' : null,
                    refresh_token: params.refresh_token ? '存在' : '不存在',
                    type: params.type
                });

                // Supabase v2在createClient时会自动检测URL hash中的token并初始化session
                // 我们只需要等待初始化完成，然后获取session
                // 给Supabase一点时间来处理hash token
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const { data, error } = await sbClient.auth.getSession();
                
                logDebug('getSession响应', { data: data, error: error });

                if (error) {
                    setStatus(`❌ 获取会话失败：${error.message}`, true);
                    setStepInfo('');
                    logDebug('getSession错误详情', { 
                        message: error.message,
                        status: error.status,
                        code: error.code
                    });
                    return;
                }

                if (!data || !data.session) {
                    // 如果getSession没有返回session，尝试手动setSession作为fallback
                    setStatus('⚠️ 自动获取会话失败，尝试手动设置...');
                    setStepInfo('正在使用setSession手动建立会话');
                    
                    logDebug('尝试手动setSession', {
                        access_token: params.access_token ? params.access_token.substring(0, 20) + '...' : null
                    });
                    
                    const setResult = await sbClient.auth.setSession({
                        access_token: params.access_token,
                        refresh_token: params.refresh_token || ''
                    });
                    
                    logDebug('setSession响应', { data: setResult.data, error: setResult.error });
                    
                    if (setResult.error) {
                        setStatus(`❌ 手动设置会话也失败：${setResult.error.message}`, true);
                        setStepInfo('');
                        logDebug('setSession错误', { 
                            message: setResult.error.message,
                            status: setResult.error.status,
                            code: setResult.error.code
                        });
                        return;
                    }
                    
                    if (!setResult.data || !setResult.data.session) {
                        setStatus('❌ 无法建立会话，链接可能已过期', true);
                        setStepInfo('');
                        logDebug('setSession异常', { error: '返回数据中没有session' });
                        return;
                    }
                }

                setStatus('✅ 验证成功！请设置新密码');
                setStepInfo('会话已建立，可以输入新密码');
                logDebug('验证成功', { sessionExists: true });
                
                document.getElementById('status').style.display = 'none';
                document.getElementById('step-info').style.display = 'none';
                document.getElementById('form').style.display = 'block';

            } catch (err) {
                setStatus(`❌ Implicit流程失败：${err.message}`, true);
                setStepInfo('');
                logDebug('Implicit流程异常', { error: err.message, stack: err.stack });
                console.error(err);
            }
        }

        // 执行重置密码
        async function resetPassword() {
            const btn = document.getElementById('resetBtn');
            const msgDiv = document.getElementById('msg');
            const password = document.getElementById('password').value.trim();
            
            if (password.length < 6) {
                msgDiv.innerHTML = '<span class="error">⚠️ 密码至少需要6位</span>';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '正在修改...';
            msgDiv.innerHTML = '';
            
            try {
                setStepInfo('正在调用updateUser更新密码');
                logDebug('更新密码请求', { passwordLength: password.length });
                
                const { data, error } = await sbClient.auth.updateUser({ password });
                
                logDebug('updateUser响应', { data: data, error: error });
                
                if (error) {
                    msgDiv.innerHTML = `<span class="error">❌ 修改失败：${error.message}</span>`;
                    logDebug('updateUser错误', { 
                        message: error.message,
                        status: error.status,
                        code: error.code
                    });
                    btn.disabled = false;
                    btn.textContent = '确认修改';
                    return;
                }
                
                msgDiv.innerHTML = '<span class="success">✅ 密码修改成功！请返回APP重新登录。</span>';
                setStepInfo('');
                logDebug('密码修改成功', { user: data.user ? { id: data.user.id } : null });
                document.getElementById('password').value = '';
            } catch (err) {
                msgDiv.innerHTML = `<span class="error">❌ 修改失败：${err.message}</span>`;
                setStepInfo('');
                logDebug('updateUser异常', { error: err.message, stack: err.stack });
                btn.disabled = false;
                btn.textContent = '确认修改';
            }
        }
        
        // 启动：确保DOM和外部库加载完成后再执行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
