<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置密码 - 养虾助手</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: #005fcc; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover:not(:disabled) { background: #0045a3; }
        button:disabled { background: #a0c4e8; cursor: not-allowed; }
        .msg { margin-top: 15px; font-weight: bold; min-height: 20px; }
        .success { color: green; }
        .error { color: red; }
        .loading { opacity: 0.8; }
        pre { background: #f4f4f4; padding: 10px; text-align: left; font-size: 12px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 重置密码</h2>
        <div id="status">正在验证链接，请稍候...</div>
        <div id="form" style="display:none;">
            <input type="password" id="password" placeholder="请输入新密码（至少6位）">
            <button onclick="resetPassword()" id="resetBtn">确认修改</button>
            <div id="msg" class="msg"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://apumkkayconibhkaawdn.supabase.co';
        const supabaseAnonKey = 'sb_publishable_Tn8FsSUL4iDqUsNQGzos6Q_6zMKytC5';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        // 显示状态信息
        function setStatus(text, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = text;
            statusDiv.style.color = isError ? 'red' : '#333';
        }

        // 解析URL中的hash参数（手动）
        function parseHashParams() {
            const hash = window.location.hash.substring(1); // 去掉开头的#
            const params = new URLSearchParams(hash);
            return {
                access_token: params.get('access_token'),
                refresh_token: params.get('refresh_token'),
                type: params.get('type'),
                expires_in: params.get('expires_in')
            };
        }

        // 初始化：手动提取token并设置会话
        async function init() {
            try {
                setStatus('正在解析链接参数...');
                const { access_token, refresh_token, type } = parseHashParams();
                
                if (!access_token) {
                    setStatus('❌ 链接无效：找不到访问令牌。请确保从邮件中点击完整链接打开。', true);
                    return;
                }
                
                if (type !== 'recovery') {
                    setStatus(`❌ 链接类型错误：期望 recovery，实际 ${type}。请重新发送重置邮件。`, true);
                    return;
                }
                
                setStatus('正在验证令牌并建立会话...');
                // 手动设置会话
                const { data, error } = await supabase.auth.setSession({
                    access_token: access_token,
                    refresh_token: refresh_token
                });
                
                if (error) throw error;
                
                // 会话建立成功，显示修改密码表单
                setStatus('✅ 验证成功！请设置新密码');
                document.getElementById('status').style.display = 'none';
                document.getElementById('form').style.display = 'block';
            } catch (err) {
                setStatus(`❌ 验证失败：${err.message}。可能链接已过期，请重新发送重置邮件。`, true);
                console.error(err);
            }
        }

        // 执行重置密码
        async function resetPassword() {
            const btn = document.getElementById('resetBtn');
            const msgDiv = document.getElementById('msg');
            const password = document.getElementById('password').value.trim();
            
            if (password.length < 6) {
                msgDiv.innerHTML = '<span class="error">⚠️ 密码至少需要6位</span>';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '正在修改...';
            msgDiv.innerHTML = '';
            
            try {
                const { error } = await supabase.auth.updateUser({ password });
                if (error) throw error;
                msgDiv.innerHTML = '<span class="success">✅ 密码修改成功！请返回APP重新登录。</span>';
                // 可以清空密码框
                document.getElementById('password').value = '';
            } catch (err) {
                msgDiv.innerHTML = `<span class="error">❌ 修改失败：${err.message}</span>`;
                btn.disabled = false;
                btn.textContent = '确认修改';
            }
        }
        
        // 启动
        init();
    </script>
</body>
</html>
