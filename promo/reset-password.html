<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置密码 - 养虾助手</title>
    <!-- 引入 Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: #005fcc; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover:not(:disabled) { background: #0045a3; }
        button:disabled { background: #a0c4e8; cursor: not-allowed; }
        .msg { margin-top: 15px; font-weight: bold; min-height: 20px; }
        .success { color: green; }
        .error { color: red; }
        .loading { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 重置密码</h2>
        
        <!-- 1. 验证链接时的加载状态 -->
        <div id="loading">正在验证链接，请稍候...</div>
        
        <!-- 2. 重置表单（验证通过后才显示） -->
        <div id="form" style="display:none;">
            <input type="password" id="password" placeholder="请输入新密码（至少6位）">
            <button onclick="resetPassword()" id="resetBtn">确认修改</button>
            <div id="msg" class="msg"></div>
        </div>
        
        <!-- 3. 错误提示（验证失败时显示） -->
        <div id="error-box" style="display:none;" class="msg error"></div>
    </div>

    <script>
        // 你的 Supabase 项目配置
        const supabaseUrl = 'https://apumkkayconibhkaawdn.supabase.co';
        const supabaseAnonKey = 'sb_publishable_Tn8FsSUL4iDqUsNQGzos6Q_6zMKytC5'; // 确认这是你的 Publishable Key
        
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        // 初始化：解析 URL 中的 Token
        async function init() {
            const loadingEl = document.getElementById('loading');
            const formEl = document.getElementById('form');
            const errorBox = document.getElementById('error-box');
            
            try {
                // 官方推荐方法：从 URL 中提取并验证 Session
                const { data, error } = await supabase.auth.getSessionFromUrl();
                
                if (error) throw error;
                
                // 额外校验：确保这是一个密码恢复(recovery)链接
                const urlParams = new URLSearchParams(window.location.hash.substring(1));
                if (urlParams.get('type') !== 'recovery') {
                    throw new Error('无效的链接类型');
                }

                // 验证通过，隐藏 Loading，显示表单
                loadingEl.style.display = 'none';
                formEl.style.display = 'block';
                
            } catch (error) {
                // 验证失败（例如：链接过期、被重复点击过）
                loadingEl.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.textContent = `❌ 链接无效或已过期：${error.message}`;
            }
        }

        // 执行重置密码操作
        async function resetPassword() {
            const btn = document.getElementById('resetBtn');
            const msg = document.getElementById('msg');
            const password = document.getElementById('password').value.trim();

            // 前端基础校验
            if (password.length < 6) {
                msg.textContent = '⚠️ 密码至少需要6位';
                msg.className = 'msg error';
                return;
            }

            // 禁用按钮，防止用户网络卡顿时疯狂点击
            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = '正在修改...';
            msg.textContent = '';

            try {
                // 调用 Supabase 更新密码接口
                const { error } = await supabase.auth.updateUser({ password });
                if (error) throw error;

                // 修改成功，提示用户回APP登录
                msg.textContent = '✅ 密码修改成功！请返回APP重新登录。';
                msg.className = 'msg success';
                
            } catch (error) {
                // 修改失败
                msg.textContent = `❌ 修改失败：${error.message}`;
                msg.className = 'msg error';
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.textContent = '确认修改';
            }
        }

        // 页面加载完成后自动执行初始化
        init();
    </script>
</body>
</html>
