<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置密码 - 养虾助手</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; max-width: 600px; margin: 20px auto; padding: 10px; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; font-size: 12px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>🔐 重置密码 - 调试模式</h2>
    <div id="debug"></div>
    <div id="form" style="display:none;">
        <input type="password" id="password" placeholder="新密码（至少6位）" style="width:100%;padding:8px;">
        <button onclick="resetPassword()">确认修改</button>
        <div id="msg"></div>
    </div>

    <script>
        const supabase = createClient(
            'https://apumkkayconibhkaawdn.supabase.co',
            'sb_publishable_Tn8FsSUL4iDqUsNQGzos6Q_6zMKytC5'
        );

        function log(msg, isError = false) {
            const div = document.getElementById('debug');
            const p = document.createElement('p');
            p.textContent = msg;
            p.style.color = isError ? 'red' : 'black';
            div.appendChild(p);
            console.log(msg);
        }

        async function init() {
            log('1. 页面加载完成');
            log('2. 当前完整URL: ' + window.location.href);
            
            const hash = window.location.hash.substring(1);
            log('3. 提取的hash内容: "' + hash + '"');
            
            if (!hash) {
                log('❌ 错误：hash为空，请确保是从邮件中点击链接打开的', true);
                return;
            }
            
            const params = new URLSearchParams(hash);
            const access_token = params.get('access_token');
            const refresh_token = params.get('refresh_token');
            const type = params.get('type');
            
            log('4. 解析参数: access_token=' + (access_token ? access_token.substring(0,10)+'...' : '无'));
            log('5. type = ' + type);
            
            if (!access_token) {
                log('❌ 错误：未找到access_token', true);
                return;
            }
            
            if (type !== 'recovery') {
                log('⚠️ 警告：type不是recovery，当前type=' + type, true);
            }
            
            try {
                log('6. 正在调用 supabase.auth.setSession...');
                const { data, error } = await supabase.auth.setSession({
                    access_token: access_token,
                    refresh_token: refresh_token
                });
                if (error) {
                    log('❌ setSession失败: ' + error.message, true);
                    return;
                }
                log('✅ setSession成功，用户已认证');
                // 显示表单
                document.getElementById('form').style.display = 'block';
                document.getElementById('debug').style.display = 'none'; // 可选：隐藏调试信息
            } catch (err) {
                log('❌ 异常: ' + err.message, true);
            }
        }
        
        async function resetPassword() {
            const newPassword = document.getElementById('password').value.trim();
            if (newPassword.length < 6) {
                document.getElementById('msg').innerHTML = '<span style="color:red;">密码至少6位</span>';
                return;
            }
            const { error } = await supabase.auth.updateUser({ password: newPassword });
            if (error) {
                document.getElementById('msg').innerHTML = '<span style="color:red;">修改失败：' + error.message + '</span>';
            } else {
                document.getElementById('msg').innerHTML = '<span style="color:green;">✅ 密码已修改，请去APP登录</span>';
            }
        }
        
        init();
    </script>
</body>
</html>
