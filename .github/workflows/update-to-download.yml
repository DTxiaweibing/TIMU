name: update-to-download

on:
  push:
    paths:
      - 'update.json'
  workflow_dispatch:

jobs:
  sync-download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 update.json 提取下载地址，写入 download.txt 并更新 index.html
        run: |
          URL=$(jq -r '.file_info.download_url' update.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "❌ update.json 中未找到 file_info.download_url，跳过"
            exit 0
          fi
          echo "📥 从 update.json 提取到的下载地址: $URL"

          # 更新 download.txt
          echo "$URL" > download/download.txt
          echo "✅ 已更新 download/download.txt"

          # 更新 index.html 中的 DOWNLOAD_URL 变量
          sed -i "s|var DOWNLOAD_URL = '.*'|var DOWNLOAD_URL = '${URL}'|g" download/index.html
          echo "✅ 已更新 download/index.html 中的下载地址"

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/download.txt download/index.html
          if git diff --staged --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "🔗 从 update.json 同步下载地址"
            git push
            echo "✅ 已提交并推送"
          fi