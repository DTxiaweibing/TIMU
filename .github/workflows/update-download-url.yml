name: 自动更新下载地址

on:
  push:
    paths:
      - 'download/download.txt'
  workflow_dispatch:

jobs:
  update-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取 download.txt 并更新 index.html
        run: |
          URL=$(cat download/download.txt | tr -d '\r\n' | xargs)
          if [ -z "$URL" ]; then
            echo "❌ download.txt 为空，跳过更新"
            exit 0
          fi
          echo "📥 读取到的下载地址: $URL"

          # 检查 index.html 中是否已有相同地址
          if grep -qF "$URL" download/index.html; then
            echo "✅ index.html 中已包含相同地址，无需更新"
            exit 0
          fi

          # 正则替换 DOWNLOAD_URL 变量值（无论当前是占位符还是旧地址都生效）
          sed -i "s|var DOWNLOAD_URL = '.*'|var DOWNLOAD_URL = '${URL}'|g" download/index.html
          echo "✅ 已更新 index.html 中的下载地址: ${URL}"

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/index.html
          if git diff --staged --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "🔗 自动更新下载地址: ${URL}"
            git push
            echo "✅ 已提交并推送"
          fi